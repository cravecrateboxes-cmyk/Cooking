<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff8a2b" />
    <title>Order Up</title>
    <script>
      // outlined text needs paint-order on HTML text (Chrome 123+); older Android WebViews get a shadow outline (src/oldtext.css)
      var chrome = /Chrome\/(\d+)/.exec(navigator.userAgent);
      if (chrome && Number(chrome[1]) < 123) document.documentElement.classList.add('no-paint-order');
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="ui" class="layer"></div>
    </div>
    <div id="loader">
      <div>
        <div class="disp load-logo">Order<span>Up!</span></div>
        <div class="load-track"><div id="load-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
